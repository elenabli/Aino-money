server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_read_timeout 120s;
        # Chat answers stream as server-sent events; pass each event through immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
